name: Verified Full acceptance tools
description: Restore or download the two pinned tools once, always checking their original digests
runs:
  using: composite
  steps:
    - name: Cache pinned Full acceptance tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .acceptance-build/dependencies
        key: full-tools-amd64-${{ hashFiles('scripts/quality/prepare-full-dependencies.sh') }}
    - name: Prepare verified Full tools once
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/quality/prepare-full-dependencies.sh .acceptance-build/dependencies
