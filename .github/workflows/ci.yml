name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Platform and Agent quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod

      - name: Install locked JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"

      - name: Run formatting, lint, types and tests
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm test:full
          pnpm test:performance
          pnpm test:deployment

      - name: Run network-blocked Lite browser flow
        run: pnpm test:offline

      - name: Build platform and Agent
        run: pnpm build
