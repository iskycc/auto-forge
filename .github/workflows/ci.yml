name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Formatting, lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod
      - name: Validate source and E2E coverage inventory
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test:e2e:matrix

  unit-integration:
    name: Unit, integration and performance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod
      - name: Set up Java 8 for Adapter
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Run automated tests
        run: |
          pnpm test
          pnpm test:integration
          pnpm test:performance

      - name: Build and verify Adapter on Java 8
        run: bash scripts/quality/test-cotest-adapter-java8.sh

      - name: Set up Java 21 for current TestNG compatibility
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Adapter with TestNG 7.11 and Groovy tools
        run: |
          mvn --batch-mode --no-transfer-progress --file adapters/cotest-testng/pom.xml -Dtestng.version=7.11.0 test
          bash scripts/quality/test-groovy-tools.sh

  jenkins-plugins:
    name: Jenkins HPI and Pipeline E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node.js for plugin metadata checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Enable locked pnpm launcher
        run: corepack enable
      - name: Build and verify Jenkins plugins
        run: pnpm test:jenkins-plugins
      - name: Verify newer Pipeline Step API compatibility
        run: |
          mvn --batch-mode --no-transfer-progress --file integrations/jenkins/pom.xml \
            -Dworkflow-step-api.version=724.v538c2362b_dfb_ clean verify
          bash scripts/verify-jenkins-hpis.sh 1.2.0-SNAPSHOT 724.v538c2362b_dfb_

  lite-browser:
    name: Lite browser · ${{ matrix.scenario }}
    needs: build
    runs-on: ubuntu-24.04
    # Production build, desktop screenshots and artifact upload share this deadline.
    timeout-minutes: ${{ matrix.timeout_minutes || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: assets
            specs: tests/e2e/case-suite-lifecycle.spec.ts tests/e2e/jar-import.spec.ts tests/e2e/project-isolation.spec.ts
            project_maximum_concurrency: ""
            screenshots: true
          - scenario: analysis
            specs: tests/e2e/failure-analysis.spec.ts tests/e2e/failure-analysis-log-comparison.spec.ts tests/e2e/failure-analysis-assignment.spec.ts tests/e2e/read-model-cache.spec.ts tests/e2e/testng-directory-execution.spec.ts
            project_maximum_concurrency: ""
            screenshots: true
          - scenario: ddt
            timeout_minutes: 25
            specs: tests/e2e/ddt-management.spec.ts tests/e2e/ddt-change-review.spec.ts
            project_maximum_concurrency: ""
            screenshots: true
          - scenario: execution
            specs: tests/e2e/execution-recovery.spec.ts tests/e2e/single-case-run.spec.ts tests/e2e/case-debug.spec.ts
            project_maximum_concurrency: "1"
            screenshots: true
          - scenario: identity
            specs: tests/e2e/identity-rbac.spec.ts tests/e2e/all-rounds.spec.ts
            project_maximum_concurrency: ""
            screenshots: false
          - scenario: operations-configuration
            specs: tests/e2e/platform-initialization.spec.ts tests/e2e/log-archives.spec.ts tests/e2e/security-audit.spec.ts tests/e2e/management-operations.spec.ts
            project_maximum_concurrency: ""
            screenshots: true
          - scenario: operations-runtime
            specs: tests/e2e/runner-telemetry.spec.ts tests/e2e/platform-operations.spec.ts tests/e2e/scheduling-refill.spec.ts tests/e2e/memory-admission.spec.ts
            project_maximum_concurrency: ""
            screenshots: true
          - scenario: ui-1
            specs: tests/e2e/ui-layout.spec.ts tests/e2e/tab-navigation.spec.ts
            grep_invert: primary product and administration routes
            shard: 1/3
            agent_resources: true
            timeout_minutes: 20
            project_maximum_concurrency: ""
            screenshots: true
          - scenario: ui-2
            specs: tests/e2e/ui-layout.spec.ts tests/e2e/tab-navigation.spec.ts
            grep_invert: primary product and administration routes
            shard: 2/3
            agent_resources: true
            timeout_minutes: 20
            project_maximum_concurrency: ""
            screenshots: true
          - scenario: ui-3
            specs: tests/e2e/ui-layout.spec.ts tests/e2e/tab-navigation.spec.ts
            grep_invert: primary product and administration routes
            shard: 3/3
            agent_resources: true
            timeout_minutes: 20
            project_maximum_concurrency: ""
            screenshots: true
          - scenario: ui-pages
            specs: tests/e2e/ui-layout.spec.ts
            grep: primary product and administration routes
            project_maximum_concurrency: ""
            screenshots: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Install CJK font for reviewable UI screenshots
        if: matrix.screenshots
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-wqy-microhei
          fc-cache --force
          test -n "$(fc-list :lang=zh family)"
      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"
      - name: Run isolated Lite browser scenario
        env:
          AUTOFORGE_E2E_DATA_DIR: ${{ runner.temp }}/autoforge-${{ matrix.scenario }}
          AUTOFORGE_UI_SCREENSHOT_DIR: ${{ matrix.screenshots && format('{0}/autoforge-ui-screenshots', runner.temp) || '' }}
          E2E_PROJECT_MAXIMUM_CONCURRENCY: ${{ matrix.project_maximum_concurrency }}
          E2E_SCENARIO_SPECS: ${{ matrix.specs }}
          E2E_SCENARIO_INCLUDE: ${{ matrix.grep }}
          E2E_SCENARIO_EXCLUDE: ${{ matrix.grep_invert }}
          E2E_SCENARIO_SHARD: ${{ matrix.shard }}
        run: |
          read -r -a scenario_specs <<< "${E2E_SCENARIO_SPECS}"
          scenario_filters=()
          if [[ -n "${E2E_SCENARIO_INCLUDE}" ]]; then
            scenario_filters+=(--grep "${E2E_SCENARIO_INCLUDE}")
          fi
          if [[ -n "${E2E_SCENARIO_EXCLUDE}" ]]; then
            scenario_filters+=(--grep-invert "${E2E_SCENARIO_EXCLUDE}")
          fi
          if [[ -n "${E2E_SCENARIO_SHARD}" ]]; then
            # Distribute individual tests; each isolated job still uses one browser worker.
            scenario_filters+=(--fully-parallel --shard "${E2E_SCENARIO_SHARD}")
          fi
          pnpm exec playwright test "${scenario_specs[@]}" "${scenario_filters[@]}"
      - name: Upload serial UI screenshots
        if: always() && matrix.screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-layout-screenshots-${{ matrix.scenario }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/autoforge-ui-screenshots
          if-no-files-found: warn
          retention-days: 7
      - name: Upload browser trace on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-trace-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  lite-concurrency:
    name: Lite 500-slot protocol concurrency
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"
      - name: Exercise 500 concurrent Runner protocol slots
        env:
          AUTOFORGE_E2E_DATA_DIR: ${{ runner.temp }}/autoforge-lite-concurrency
          AUTOFORGE_CONCURRENCY_REPORT: ${{ runner.temp }}/autoforge-performance/lite-concurrency.json
          E2E_PROJECT_MAXIMUM_CONCURRENCY: "500"
        run: pnpm test:lite-concurrency
      - name: Upload concurrency measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lite-concurrency-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/autoforge-performance
            test-results
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build shared production outputs
    uses: ./.github/workflows/acceptance-build.yml

  verification-image:
    name: Current SHA amd64 verification image
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[verification-image]')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AUTOFORGE_BUILDX_CACHE_FROM: type=gha,scope=ci-verification-backend-amd64,timeout=2m
      AUTOFORGE_BUILDX_CACHE_TO: type=gha,mode=max,scope=ci-verification-backend-amd64,timeout=2m,ignore-error=true
      AUTOFORGE_RELEASE_REVISION: ${{ github.sha }}
      BACKEND_IMAGE: autoforge/backend:0.0.0-ci.${{ github.run_id }}-amd64
      BACKEND_PLATFORM: linux/amd64
      VERIFICATION_VERSION: 0.0.0-ci.${{ github.run_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Set up Go for embedded Agent resources
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod
      - name: Record reproducible build time
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - name: Set up Java for embedded Jenkins plugins
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build embedded Jenkins plugins for the verification image
        run: |
          mvn --batch-mode --no-transfer-progress --file integrations/jenkins/pom.xml -Drevision="${VERIFICATION_VERSION}" -Dchangelist= -DskipTests package
          bash scripts/verify-jenkins-hpis.sh "${VERIFICATION_VERSION}"
          node scripts/release/stage-jenkins-resources.mjs "${VERIFICATION_VERSION}"
      - name: Build Docker-native verification image
        run: >-
          bash scripts/release/build-backend-image.sh
          "${VERIFICATION_VERSION}" amd64 dist/verification
      - name: Load and verify image
        run: |
          docker load --input "dist/verification/autoforge-backend-${VERIFICATION_VERSION}-amd64.docker.tar"
          bash scripts/release/verify-backend-image.sh "${BACKEND_IMAGE}" "${BACKEND_PLATFORM}"
      - name: Upload verification image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-backend-amd64-${{ github.sha }}
          path: dist/verification/*.docker.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  real-agent-acceptance:
    name: Network-blocked real Agent acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"
      - name: Run real Agent acceptance without outbound network
        run: pnpm test:real-agent
      - name: Upload browser and Agent diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-agent-acceptance-diagnostics-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  batch-input-sharing-acceptance:
    name: Batch-shared Runner inputs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"
      - name: Verify shared downloads, extraction and cleanup
        run: pnpm test:batch-input-sharing
      - name: Upload browser and Agent diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batch-input-sharing-diagnostics-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  container-executor-acceptance:
    name: Immutable container executor acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"
      - name: Run immutable container executor acceptance
        run: pnpm test:container-executor
      - name: Upload browser and Agent diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-executor-acceptance-diagnostics-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ldap-acceptance:
    name: Network-blocked real LDAP acceptance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"
      - name: Run real LDAP acceptance without service egress
        run: pnpm test:ldap-e2e
      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ldap-acceptance-diagnostics-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  runner-install-acceptance:
    name: Offline SSH and systemd Runner installation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"
      - name: Run SSH installation acceptance without service egress
        run: pnpm test:runner-install-e2e
      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-install-acceptance-diagnostics-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  system-acceptance:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    # Pinned toolchains can fall back to upstream downloads. Include preparation,
    # source builds and bounded business checks within the job's total deadline.
    timeout-minutes: ${{ matrix.timeout_minutes || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Full · capacity and performance
            command: bash scripts/quality/test-full-business-recovery.sh capacity-contracts
          - name: Full · adapter contracts
            command: bash scripts/quality/test-full-business-recovery.sh adapter-contracts
          - name: Full · runtime Agent
            command: bash scripts/quality/test-full-business-recovery.sh runtime-agent
          - name: Full · runtime recovery
            command: bash scripts/quality/test-full-business-recovery.sh runtime-recovery
          - name: Full · asset lifecycle
            command: bash scripts/quality/test-full-business-recovery.sh browser-assets
            timeout_minutes: 15
          - name: Full · governance
            command: bash scripts/quality/test-full-business-recovery.sh browser-governance
            timeout_minutes: 15
          - name: Network-blocked Lite · assets
            command: bash scripts/quality/test-offline.sh assets
            timeout_minutes: 15
          - name: Network-blocked Lite · governance
            command: bash scripts/quality/test-offline.sh governance
          - name: Network-blocked Lite · operations and deployment
            command: bash scripts/quality/test-offline.sh operations && pnpm test:deployment
            timeout_minutes: 20
          - name: Network-blocked Lite · recovery
            command: bash scripts/quality/test-offline.sh recovery
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies
      - name: Restore shared production outputs
        uses: ./.github/actions/restore-acceptance-build
      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"
      - name: Run system acceptance
        run: ${{ matrix.command }}
      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-acceptance-diagnostics-${{ matrix.name }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  distributed-acceptance:
    name: Full distributed acceptance
    needs: build
    uses: ./.github/workflows/distributed.yml
    with:
      build_artifact: acceptance-runtime

  ci-gate:
    name: CI gate
    if: always() && !cancelled()
    needs:
      [
        static-quality,
        unit-integration,
        jenkins-plugins,
        lite-browser,
        lite-concurrency,
        distributed-acceptance,
        build,
        real-agent-acceptance,
        batch-input-sharing-acceptance,
        container-executor-acceptance,
        ldap-acceptance,
        runner-install-acceptance,
        system-acceptance,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Node.js for cost reporting
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
