name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate semantic version tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${REQUESTED_TAG}" >&2
            exit 1
          fi
          revision="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "${revision}" != "${GITHUB_SHA}" ]]; then
            echo "The workflow ref (${GITHUB_SHA}) must be the requested tagged commit (${revision})." >&2
            exit 1
          fi
          {
            echo "revision=${revision}"
            echo "tag=${REQUESTED_TAG}"
            echo "version=${REQUESTED_TAG#v}"
            echo "source_date_epoch=$(git show -s --format=%ct "${REQUESTED_TAG}^{commit}")"
          } >> "${GITHUB_OUTPUT}"

  adapter:
    name: Build CoTest Adapter
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Build Adapter JAR
        run: >-
          mvn --batch-mode --no-transfer-progress
          --file adapters/cotest-testng/pom.xml clean verify

      - name: Stage embedded Adapter
        run: >-
          cp adapters/cotest-testng/target/cotest-testng-adapter-0.1.0-SNAPSHOT.jar
          cotest-testng-adapter.jar

      - name: Upload embedded Adapter
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embedded-cotest-adapter
          path: cotest-testng-adapter.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  backend:
    name: Backend ${{ matrix.variant }}
    needs: [prepare, adapter]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - variant: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - variant: amd64-musl
            runner: ubuntu-24.04
            platform: linux/amd64
          - variant: arm64-musl
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      AUTOFORGE_BUILDX_CACHE_FROM: type=gha,scope=release-backend-${{ matrix.variant }},timeout=2m
      AUTOFORGE_BUILDX_CACHE_TO: type=gha,mode=max,scope=release-backend-${{ matrix.variant }},timeout=2m,ignore-error=true
      AUTOFORGE_RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      BACKEND_IMAGE: autoforge/backend:${{ needs.prepare.outputs.version }}-${{ matrix.variant }}
      BACKEND_PLATFORM: ${{ matrix.platform }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Go for embedded Agent resources
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod

      - name: Download embedded Adapter
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: embedded-cotest-adapter
          path: dist/adapter

      - name: Build Docker-native offline image
        env:
          AUTOFORGE_ADAPTER_JAR: ${{ github.workspace }}/dist/adapter/cotest-testng-adapter.jar
        run: bash scripts/release/build-backend-image.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.variant }}" dist/release

      - name: Load and verify offline image
        run: |
          docker load --input "dist/release/autoforge-backend-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}.docker.tar"
          bash scripts/release/verify-backend-image.sh "${BACKEND_IMAGE}" "${BACKEND_PLATFORM}"
          node scripts/release/create-backend-image-metadata.mjs \
            "${BACKEND_IMAGE}" "${{ needs.prepare.outputs.version }}" "${{ matrix.variant }}" \
            "dist/release/autoforge-backend-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}.image.json"

      - name: Generate backend image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.BACKEND_IMAGE }}
          format: spdx-json
          output-file: dist/release/autoforge-backend-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Upload backend release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-backend-${{ matrix.variant }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  jenkins-plugins:
    name: Jenkins Pipeline plugins
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and verify Jenkins plugins
        run: >-
          mvn --batch-mode --no-transfer-progress
          --file integrations/jenkins/pom.xml
          -Drevision=${{ needs.prepare.outputs.version }}
          -Dchangelist=
          verify

      - name: Verify packaged Jenkins HPI metadata and Pipeline steps
        run: bash scripts/verify-jenkins-hpis.sh "${{ needs.prepare.outputs.version }}"

      - name: Stage Jenkins plugins
        run: |
          mkdir -p dist/release
          cp integrations/jenkins/autoforge-execution/target/autoforge-execution.hpi \
            "dist/release/autoforge-jenkins-execution-${{ needs.prepare.outputs.version }}.hpi"
          cp integrations/jenkins/autoforge-dependency-publisher/target/autoforge-dependency-publisher.hpi \
            "dist/release/autoforge-jenkins-dependency-publisher-${{ needs.prepare.outputs.version }}.hpi"

      - name: Generate execution plugin SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/release/autoforge-jenkins-execution-${{ needs.prepare.outputs.version }}.hpi
          format: spdx-json
          output-file: dist/release/autoforge-jenkins-execution-${{ needs.prepare.outputs.version }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Generate dependency publisher plugin SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/release/autoforge-jenkins-dependency-publisher-${{ needs.prepare.outputs.version }}.hpi
          format: spdx-json
          output-file: dist/release/autoforge-jenkins-dependency-publisher-${{ needs.prepare.outputs.version }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Upload Jenkins plugin release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jenkins-plugins
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Assemble and publish GitHub Release
    needs: [prepare, backend, jenkins-plugins]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Build versioned Compose deployment bundle
        run: bash scripts/release/build-deployment-bundle.sh "${{ needs.prepare.outputs.version }}" release

      - name: Extract deployment bundle for SBOM
        run: |
          mkdir -p "${RUNNER_TEMP}/autoforge-deploy-sbom"
          tar -xzf "release/autoforge-deploy-${{ needs.prepare.outputs.version }}.tar.gz" \
            -C "${RUNNER_TEMP}/autoforge-deploy-sbom"

      - name: Generate deployment bundle SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/autoforge-deploy-sbom
          format: spdx-json
          output-file: release/autoforge-deploy-${{ needs.prepare.outputs.version }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Add license and attribution files
        run: >-
          cp CHANGELOG.md COMPATIBILITY.md LICENSE NOTICE THIRD_PARTY_LICENSES.json
          release-signing-public-key.pem release/

      - name: Create release manifest and checksums
        run: node scripts/release/create-manifest.mjs "${{ needs.prepare.outputs.version }}" release

      - name: Sign release checksums
        env:
          AUTOFORGE_RELEASE_SIGNING_KEY: ${{ secrets.AUTOFORGE_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "${AUTOFORGE_RELEASE_SIGNING_KEY:-}" ]]; then
            echo "AUTOFORGE_RELEASE_SIGNING_KEY is not configured." >&2
            exit 1
          fi
          umask 077
          signing_key_path="$(mktemp)"
          cleanup_signing_key() {
            shred --remove --zero -- "${signing_key_path}"
          }
          trap cleanup_signing_key EXIT
          printf '%s\n' "${AUTOFORGE_RELEASE_SIGNING_KEY}" >"${signing_key_path}"
          bash scripts/release/sign-checksums.sh \
            "${signing_key_path}" \
            release/SHA256SUMS \
            release/SHA256SUMS.sig \
            release/release-signing-public-key.pem

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Create or validate draft Release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" == "true" ]]; then
              echo "Updating existing draft Release ${RELEASE_TAG}."
            else
              echo "Updating existing published Release ${RELEASE_TAG}."
            fi
          else
            gh release create "${RELEASE_TAG}" --draft --generate-notes --title "AutoForge ${RELEASE_TAG}" --verify-tag
          fi

      - name: Upload assets and publish Release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" release/* --clobber
          if [[ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false
          fi
