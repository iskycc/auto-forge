name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate semantic version tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${REQUESTED_TAG}" >&2
            exit 1
          fi
          revision="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"
          if [[ "${revision}" != "${GITHUB_SHA}" ]]; then
            echo "The workflow ref (${GITHUB_SHA}) must be the requested tagged commit (${revision})." >&2
            exit 1
          fi
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${REQUESTED_TAG#v}" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=$(git show -s --format=%ct "${REQUESTED_TAG}^{commit}")" >> "${GITHUB_OUTPUT}"

  quality:
    name: Release quality gate
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod

      - name: Install locked JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run quality commands
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:integration
          pnpm build

      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"

      - name: Run Lite browser flow
        run: pnpm test:e2e

  agent:
    name: Agent ${{ matrix.variant }}
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [amd64, arm64, amd64-musl, arm64-musl]
    env:
      AUTOFORGE_RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod

      - name: Build static Agent binary
        run: bash scripts/release/build-agent.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.variant }}" dist/release

      - name: Generate Agent SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/release/autoforge-agent-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}
          format: spdx-json
          output-file: dist/release/autoforge-agent-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Upload Agent release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-agent-${{ matrix.variant }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend ${{ matrix.variant }}
    needs: [prepare, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [amd64, arm64, amd64-musl, arm64-musl]
    env:
      AUTOFORGE_KEEP_DOCKER_TAR: "1"
      AUTOFORGE_RELEASE_REVISION: ${{ needs.prepare.outputs.revision }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image platform
        run: |
          case "${{ matrix.variant }}" in
            amd64 | amd64-musl) platform="linux/amd64" ;;
            arm64 | arm64-musl) platform="linux/arm64" ;;
          esac
          echo "BACKEND_PLATFORM=${platform}" >> "${GITHUB_ENV}"
          echo "BACKEND_IMAGE=autoforge/backend:${{ needs.prepare.outputs.version }}-${{ matrix.variant }}" >> "${GITHUB_ENV}"

      - name: Build compressed offline image
        run: bash scripts/release/build-backend-image.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.variant }}" dist/release

      - name: Load and verify offline image
        run: |
          docker load --input "dist/release/autoforge-backend-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}.docker.tar"
          bash scripts/release/verify-backend-image.sh "${BACKEND_IMAGE}" "${BACKEND_PLATFORM}"

      - name: Generate backend image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.BACKEND_IMAGE }}
          format: spdx-json
          output-file: dist/release/autoforge-backend-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}.spdx.json
          syft-version: v1.50.0
          upload-artifact: false
          upload-release-assets: false

      - name: Remove uncompressed intermediate image
        run: rm -- "dist/release/autoforge-backend-${{ needs.prepare.outputs.version }}-${{ matrix.variant }}.docker.tar"

      - name: Upload backend release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-backend-${{ matrix.variant }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [prepare, agent, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download all release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create release manifest and checksums
        run: node scripts/release/create-manifest.mjs "${{ needs.prepare.outputs.version }}" release

      - name: Generate build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Create or validate draft Release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
            if [[ "${is_draft}" != "true" ]]; then
              echo "Release ${RELEASE_TAG} already exists and is not a draft." >&2
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" --draft --generate-notes --title "AutoForge ${RELEASE_TAG}" --verify-tag
          fi

      - name: Upload assets and publish Release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "${RELEASE_TAG}" release/* --clobber
          gh release edit "${RELEASE_TAG}" --draft=false
