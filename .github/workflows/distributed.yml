name: Full distributed acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_artifact:
        description: Verified production build from the caller workflow
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: distributed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare-build:
    if: inputs.build_artifact == ''
    uses: ./.github/workflows/acceptance-build.yml

  acceptance:
    needs: prepare-build
    if: ${{ !cancelled() && (needs.prepare-build.result == 'success' || needs.prepare-build.result == 'skipped') }}
    name: Distributed · ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # The mixed 73-scenario, 500-slot run needs build and evidence-upload headroom.
    timeout-minutes: ${{ matrix.phase == 'browser-background' && 40 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: storage and queue contracts
            phase: distributed-contracts
          - name: two-node browser and fault recovery
            phase: browser-distributed
          - name: background jobs with 500 execution slots
            phase: browser-background
          - name: real Go Agent through Nginx
            phase: distributed-agent
    steps:
      - name: Check out exact source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Restore the shared production build
        uses: ./.github/actions/restore-acceptance-build
        with:
          artifact: ${{ inputs.build_artifact || 'acceptance-runtime' }}

      - name: Set up Java for real TestNG execution
        if: matrix.phase == 'distributed-agent'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Locate preinstalled Chromium
        if: matrix.phase != 'distributed-contracts'
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          test -n "${browser_path}"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"

      - name: Run isolated distributed acceptance
        env:
          ACCEPTANCE_PHASE: ${{ matrix.phase }}
        run: bash scripts/quality/test-full.sh "${ACCEPTANCE_PHASE}"

      - name: Require executed tests and no skipped cases
        env:
          ACCEPTANCE_PHASE: ${{ matrix.phase }}
        run: node scripts/quality/verify-distributed-results.mjs "${ACCEPTANCE_PHASE}"

      - name: Preserve evidence on success or failure
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributed-${{ matrix.phase }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  distributed-gate:
    name: Distributed acceptance gate
    if: always() && !cancelled()
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every distributed partition
        env:
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: test "${ACCEPTANCE_RESULT}" = success
