name: Release checks

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to check, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-checks-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Resolve release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks_revision: ${{ steps.release.outputs.checks_revision }}
      build_run_id: ${{ steps.release.outputs.build_run_id }}
      tag: ${{ steps.release.outputs.tag }}
      tag_revision: ${{ steps.release.outputs.tag_revision }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Resolve semantic version tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          RELEASE_REVISION: ${{ github.event.workflow_run.head_sha }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ ! "${REQUESTED_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${REQUESTED_TAG}" >&2
            exit 1
          fi
          tag_revision="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"
          checks_revision="${tag_revision}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" && "${tag_revision}" != "${RELEASE_REVISION}" ]]; then
            echo 'Release artifact revision does not match the requested tag.' >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            checks_revision="${GITHUB_SHA}"
          fi
          {
            echo "checks_revision=${checks_revision}"
            echo "build_run_id=${RELEASE_RUN_ID}"
            echo "tag=${REQUESTED_TAG}"
            echo "tag_revision=${tag_revision}"
            echo "version=${REQUESTED_TAG#v}"
          } >> "${GITHUB_OUTPUT}"

  full-tools:
    name: Prepare shared Full acceptance tools
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checks_revision }}
      - uses: ./.github/actions/setup-full-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-full-tools
          path: .acceptance-build/dependencies/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  quality:
    name: Release source · ${{ matrix.name }}
    needs: [prepare, full-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static quality
            command: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test:e2e:matrix
          - name: unit and integration
            command: pnpm test && pnpm test:integration && bash scripts/quality/test-cotest-adapter-java8.sh && bash scripts/quality/test-groovy-tools.sh
          - name: CoTest Adapter current runtime
            command: mvn --batch-mode --no-transfer-progress --file adapters/cotest-testng/pom.xml -Dtestng.version=7.11.0 test
          - name: performance
            command: pnpm test:performance
          - name: Lite 500 protocol concurrency
            command: E2E_PROJECT_MAXIMUM_CONCURRENCY=500 AUTOFORGE_E2E_DATA_DIR="${RUNNER_TEMP}/autoforge-lite-concurrency" AUTOFORGE_CONCURRENCY_REPORT="${RUNNER_TEMP}/autoforge-performance/lite-concurrency.json" pnpm test:lite-concurrency
          - name: deployment
            command: pnpm test:deployment
          - name: production build
            command: node scripts/quality/prepare-acceptance-build.mjs all
          - name: Full adapter contracts
            command: bash scripts/quality/test-full.sh contracts
          - name: Full asset lifecycle
            command: bash scripts/quality/test-full.sh browser-assets
          - name: Full distributed deployment
            command: pnpm test:distributed
          - name: Full governance
            command: bash scripts/quality/test-full.sh browser-governance
          - name: Full execution recovery
            command: bash scripts/quality/test-full.sh browser-recovery
          - name: Full real Agent recovery
            command: bash scripts/quality/test-full.sh real-agent
          - name: Full real LDAP
            command: bash scripts/quality/test-full.sh ldap
          - name: Full dependency health
            command: bash scripts/quality/test-full.sh dependency-recovery
    steps:
      - name: Check out source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checks_revision }}

      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Restore the actual release build
        if: needs.prepare.outputs.build_run_id != ''
        uses: ./.github/actions/restore-acceptance-build
        with:
          run_id: ${{ needs.prepare.outputs.build_run_id }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod

      - name: Set up Java 8 for Adapter build
        if: matrix.name == 'unit and integration'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Set up Java 21 for current runtime and embedded Jenkins plugins
        if: matrix.name == 'CoTest Adapter current runtime' || matrix.name == 'production build'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"

      - name: Restore shared Full tools
        if: startsWith(matrix.name, 'Full ')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: acceptance-full-tools
          path: .acceptance-build/dependencies
      - name: Use verified local dependency copies
        if: startsWith(matrix.name, 'Full ')
        run: echo "AUTOFORGE_ACCEPTANCE_DEPENDENCY_CACHE=${GITHUB_WORKSPACE}/.acceptance-build/dependencies" >> "${GITHUB_ENV}"

      - name: Run release-source quality partition
        run: ${{ matrix.command }}

      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-diagnostics-${{ strategy.job-index }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Lite concurrency measurements
        if: always() && !cancelled() && matrix.name == 'Lite 500 protocol concurrency'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-lite-concurrency-${{ needs.prepare.outputs.tag }}
          path: ${{ runner.temp }}/autoforge-performance
          if-no-files-found: warn
          retention-days: 14

  offline-quality:
    name: Release source offline · ${{ matrix.phase }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        phase: [assets, governance, operations, recovery, analysis]
    steps:
      - name: Check out source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checks_revision }}

      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Restore the actual release build
        if: needs.prepare.outputs.build_run_id != ''
        uses: ./.github/actions/restore-acceptance-build
        with:
          run_id: ${{ needs.prepare.outputs.build_run_id }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod

      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"

      - name: Run network-blocked Lite partition
        run: bash scripts/quality/test-offline.sh "${{ matrix.phase }}"

      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-offline-diagnostics-${{ matrix.phase }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  runner-reinstall-gate:
    name: Deregistered Runner reinstall re-registration gate
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.checks_revision }}

      - name: Install cached locked dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Restore the actual release build
        if: needs.prepare.outputs.build_run_id != ''
        uses: ./.github/actions/restore-acceptance-build
        with:
          run_id: ${{ needs.prepare.outputs.build_run_id }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/runner-agent/go.mod

      - name: Run Runner Agent credential lifecycle unit tests
        run: |
          gofmt -l apps/runner-agent | tee gofmt-output.txt
          test ! -s gofmt-output.txt
          go -C apps/runner-agent vet ./...
          go -C apps/runner-agent test ./... -run 'TestEnsureIdentityAccepted|TestIdentityStore' -v

      - name: Locate preinstalled Chromium
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "${browser_path}" ]]; then
            echo "The hosted runner does not provide a preinstalled Chromium browser." >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${browser_path}" >> "${GITHUB_ENV}"

      - name: Run deregistered Runner reinstall acceptance without service egress
        run: pnpm test:runner-install-e2e

      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-reinstall-gate-diagnostics
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  release-checks-gate:
    name: Release checks gate
    if: always() && !cancelled()
    needs: [prepare, full-tools, quality, offline-quality, runner-reinstall-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every release-source partition
        run: |
          test "${{ needs.prepare.result }}" = success
          test "${{ needs.full-tools.result }}" = success
          test "${{ needs.quality.result }}" = success
          test "${{ needs.offline-quality.result }}" = success
          test "${{ needs.runner-reinstall-gate.result }}" = success
