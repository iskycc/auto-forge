name: autoforge-platform-3
services:
  web:
    image: ${AUTOFORGE_BACKEND_IMAGE:?set a verified loaded release image}
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "${AUTOFORGE_NODE_BIND:?set this node's private IP}:${AUTOFORGE_HTTP_PORT:-3000}:3000"
    volumes:
      - node-data:/var/lib/autoforge
      - type: bind
        source: ./config/platform.json
        target: /var/lib/autoforge/config/platform.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 45s
  worker:
    image: ${AUTOFORGE_BACKEND_IMAGE:?set a verified loaded release image}
    pull_policy: never
    command: ["node", "apps/worker/dist/worker.mjs", "--data-dir=/var/lib/autoforge"]
    init: true
    restart: unless-stopped
    volumes:
      - node-data:/var/lib/autoforge
      - type: bind
        source: ./config/platform.json
        target: /var/lib/autoforge/config/platform.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 45s
volumes:
  node-data:
    name: ${AUTOFORGE_NODE_DATA_VOLUME:-autoforge-platform-3-data}
