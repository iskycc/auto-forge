name: autoforge-five-hosts-nginx
services:
  nginx:
    image: nginx:1.28.2-alpine@sha256:5b4900b042ccfa8b0a73df622c3a60f2322faeb2be800cbee5aa7b44d241649e
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${AUTOFORGE_EDGE_BIND:?set the load balancer IP}:${AUTOFORGE_EDGE_PORT:-80}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 45s
