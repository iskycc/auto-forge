name: autoforge-lite

services:
  autoforge:
    image: ${AUTOFORGE_BACKEND_IMAGE:?set AUTOFORGE_BACKEND_IMAGE to a loaded AutoForge image}
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      AUTOFORGE_MODE: lite
      AUTOFORGE_DATA_DIR: /var/lib/autoforge
      AUTOFORGE_MAX_JAR_BYTES: ${AUTOFORGE_MAX_JAR_BYTES:-33554432}
      AUTOFORGE_RUNNER_BOOTSTRAP_TOKEN: ${AUTOFORGE_RUNNER_BOOTSTRAP_TOKEN:?set a runner bootstrap token of at least 32 characters}
      AUTOFORGE_RUNNER_CLAIM_RATE_LIMIT_PER_MINUTE: ${AUTOFORGE_RUNNER_CLAIM_RATE_LIMIT_PER_MINUTE:-120}
      AUTOFORGE_ADMIN_BOOTSTRAP_TOKEN: ${AUTOFORGE_ADMIN_BOOTSTRAP_TOKEN:?set an admin bootstrap token of at least 32 characters}
      AUTOFORGE_MASTER_KEY: ${AUTOFORGE_MASTER_KEY:?set a Base64-encoded 32-byte master key}
      AUTOFORGE_SESSION_TTL_HOURS: ${AUTOFORGE_SESSION_TTL_HOURS:-12}
      AUTOFORGE_TERMINAL_ACCESS_TOKEN: ${AUTOFORGE_TERMINAL_ACCESS_TOKEN:?set a terminal access token of at least 32 characters}
      AUTOFORGE_SCHEDULER_MAX_CPU_PERCENT: ${AUTOFORGE_SCHEDULER_MAX_CPU_PERCENT:-85}
      AUTOFORGE_SCHEDULER_MAX_MEMORY_PERCENT: ${AUTOFORGE_SCHEDULER_MAX_MEMORY_PERCENT:-85}
      AUTOFORGE_SCHEDULER_MAX_LOAD_PER_CPU: ${AUTOFORGE_SCHEDULER_MAX_LOAD_PER_CPU:-1}
      AUTOFORGE_SCHEDULER_METRICS_MAX_AGE_SECONDS: ${AUTOFORGE_SCHEDULER_METRICS_MAX_AGE_SECONDS:-45}
    ports:
      - "${AUTOFORGE_HTTP_BIND:-0.0.0.0}:${AUTOFORGE_HTTP_PORT:-3000}:3000"
    volumes:
      - autoforge-data:/var/lib/autoforge
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  autoforge-data:
    name: ${AUTOFORGE_DATA_VOLUME:-autoforge-lite-data}
