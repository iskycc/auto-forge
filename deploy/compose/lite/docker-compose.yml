name: autoforge-lite

services:
  autoforge:
    image: ${AUTOFORGE_BACKEND_IMAGE:?set AUTOFORGE_BACKEND_IMAGE to a loaded AutoForge image}
    pull_policy: never
    init: true
    restart: unless-stopped
    ports:
      - "${AUTOFORGE_HTTP_BIND:-0.0.0.0}:${AUTOFORGE_HTTP_PORT:-3000}:3000"
    volumes:
      - autoforge-data:/var/lib/autoforge
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  autoforge-data:
    name: ${AUTOFORGE_DATA_VOLUME:-autoforge-lite-data}
