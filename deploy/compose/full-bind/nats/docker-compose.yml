name: autoforge-nats

services:
  nats:
    image: nats:2.14.3-alpine3.22@sha256:c11af972c99ae542de8925e6a7d9c533aa1eb039660420d2074beed6089b3bf0
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${AUTOFORGE_SERVICE_BIND:?set this host private IP}:${AUTOFORGE_NATS_PORT:-4222}:4222"
    command: ["--config", "/run/secrets/nats.conf"]
    secrets:
      - source: nats-config
        target: nats.conf
    volumes:
      - type: bind
        source: ${AUTOFORGE_NATS_DATA_DIR:?set an absolute JetStream data directory}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 30s

secrets:
  nats-config:
    file: ${AUTOFORGE_SECRETS_DIR:?set an absolute secrets directory}/nats.conf
