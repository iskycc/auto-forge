name: autoforge-redis

services:
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${AUTOFORGE_SERVICE_BIND:?set this host private IP}:${AUTOFORGE_REDIS_PORT:-6379}:6379"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /run/secrets/redis.conf /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf
    secrets:
      - source: redis-config
        target: redis.conf
      - redis-password
    volumes:
      - type: bind
        source: ${AUTOFORGE_REDIS_DATA_DIR:?set an absolute Redis data directory}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$(cat /run/secrets/redis-password)" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

secrets:
  redis-config:
    file: ${AUTOFORGE_SECRETS_DIR:?set an absolute secrets directory}/redis.conf
  redis-password:
    file: ${AUTOFORGE_SECRETS_DIR:?set an absolute secrets directory}/redis-password
