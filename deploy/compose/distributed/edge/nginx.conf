worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format node_requests '$remote_addr $request_method $uri $status upstream=$upstream_addr request_id=$request_id';
    access_log /var/log/nginx/access.log node_requests;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    upstream platform {
        zone platform 64k;
        least_conn;
        server 10.20.0.11:3000 max_fails=2 fail_timeout=10s;
        server 10.20.0.12:3000 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }
    # Interactive terminal peers must meet on the same gateway. This first
    # deployment keeps that gateway on node A; normal traffic is balanced.
    upstream terminal_gateway {
        server 10.20.0.11:3000;
    }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 1024m;
        client_body_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
        # Do not enable non_idempotent: a failed POST response must not create
        # a second batch by silently replaying it on another platform node.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        location ^~ /api/v1/internal/ { return 404; }
        location = /api/v1/terminal-stream {
            proxy_pass http://terminal_gateway;
        }
        location / { proxy_pass http://platform; }
    }
}
