name: autoforge-fast-database

x-runtime: &runtime
  platform: linux/amd64
  pull_policy: never
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *runtime
    image: autoforge/offline-postgres:15-alpine-amd64
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: autoforge
      POSTGRES_USER: autoforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fill POSTGRES_PASSWORD in .env before starting PostgreSQL}
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoforge -d autoforge"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  redis:
    <<: *runtime
    image: autoforge/offline-redis:7-alpine-amd64
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${REDIS_PORT:-6379}:6379"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?fill REDIS_PASSWORD in .env}
    command:
      - |
        exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --save 60 1 --requirepass "$$REDIS_PASSWORD"
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 24
