name: autoforge-fast-database

x-runtime: &runtime
  platform: linux/amd64
  pull_policy: never
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    <<: *runtime
    image: autoforge/offline-postgres:15-alpine-amd64
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: autoforge
      POSTGRES_USER: autoforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fill POSTGRES_PASSWORD in .env before starting PostgreSQL}
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - |
          pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1
          sample_file="$${PGDATA:-/var/lib/postgresql/data}/autoforge-storage-capacity.json"
          if df -Pk "$${PGDATA:-/var/lib/postgresql/data}" | awk -v sampled_at="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            NR == 2 && $$2 > 0 && $$4 >= 0 {
              printf "{\"schemaVersion\":1,\"capacityBytes\":%.0f,\"availableBytes\":%.0f,\"sampledAt\":\"%s\"}\n", $$2 * 1024, $$4 * 1024, sampled_at;
              valid = 1;
            }
            END { if (!valid) exit 1; }
          ' > "$$sample_file.tmp" && chmod 0644 "$$sample_file.tmp" && mv -f "$$sample_file.tmp" "$$sample_file"; then
            :
          else
            rm -f "$$sample_file.tmp"
            printf 'Warning: PostgreSQL data-volume capacity sample could not be updated.\n' >&2
          fi
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  redis:
    <<: *runtime
    image: autoforge/offline-redis:7-alpine-amd64
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${REDIS_PORT:-6379}:6379"
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?fill REDIS_PASSWORD in .env}
    command:
      - |
        exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --save 60 1 --requirepass "$$REDIS_PASSWORD"
    volumes:
      - type: bind
        source: ./data/redis
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 24
