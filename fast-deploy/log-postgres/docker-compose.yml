name: autoforge-fast-log-postgres

services:
  postgres:
    image: autoforge/offline-postgres:15-alpine-amd64
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${LOG_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: autoforge_logs
      POSTGRES_PASSWORD: ${LOG_POSTGRES_PASSWORD:?fill LOG_POSTGRES_PASSWORD in .env before starting the log database}
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - |
          pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1
          sample_file="$${PGDATA:-/var/lib/postgresql/data}/autoforge-storage-capacity.json"
          if df -Pk "$${PGDATA:-/var/lib/postgresql/data}" | awk -v sampled_at="$$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            NR == 2 && $$2 > 0 && $$4 >= 0 {
              printf "{\"schemaVersion\":1,\"capacityBytes\":%.0f,\"availableBytes\":%.0f,\"sampledAt\":\"%s\"}\n", $$2 * 1024, $$4 * 1024, sampled_at;
              valid = 1;
            }
            END { if (!valid) exit 1; }
          ' > "$$sample_file.tmp" && chmod 0644 "$$sample_file.tmp" && mv -f "$$sample_file.tmp" "$$sample_file"; then
            :
          else
            rm -f "$$sample_file.tmp"
            printf 'Warning: PostgreSQL data-volume capacity sample could not be updated.\n' >&2
          fi
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
