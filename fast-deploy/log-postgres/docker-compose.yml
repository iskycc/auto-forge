name: autoforge-fast-log-postgres

services:
  postgres:
    image: autoforge/offline-postgres:15-alpine-amd64
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${LOG_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: autoforge_logs
      POSTGRES_PASSWORD: ${LOG_POSTGRES_PASSWORD:?fill LOG_POSTGRES_PASSWORD in .env before starting the log database}
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "autoforge_logs", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s

  node-exporter:
    image: autoforge/offline-node-exporter:1.12.1-amd64
    platform: linux/amd64
    pull_policy: never
    profiles: ["monitoring"]
    restart: unless-stopped
    read_only: true
    cpus: "0.25"
    mem_limit: 96m
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${NODE_EXPORTER_PORT:-19101}:9100"
    command:
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.filesystem.mount-points-include=^/pgdata$$
      - --web.disable-exporter-metrics
      - --web.max-requests=4
    volumes:
      - type: bind
        source: ./data/postgres
        target: /pgdata
        read_only: true
        bind:
          create_host_path: false
