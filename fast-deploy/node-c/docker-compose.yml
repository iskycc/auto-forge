name: autoforge-fast-storage

x-runtime: &runtime
  platform: linux/amd64
  pull_policy: never
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  nats:
    <<: *runtime
    image: autoforge/offline-nats:2.14.3-alpine3.22-amd64
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${NATS_PORT:-4222}:4222"
    command:
      [
        "--jetstream",
        "--store_dir",
        "/data",
        "--http_port",
        "8222",
        "--auth",
        "${NATS_TOKEN:?fill NATS_TOKEN in .env}",
      ]
    cap_drop: ["ALL"]
    volumes:
      - type: bind
        source: ./data/nats
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24

  minio:
    <<: *runtime
    image: autoforge/offline-minio:RELEASE.2025-04-22T22-12-26Z-amd64
    ports:
      - "${SERVICE_BIND:?set this host private IP}:${MINIO_PORT:-9000}:9000"
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autoforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?fill MINIO_ROOT_PASSWORD in .env}
    cap_drop: ["ALL"]
    volumes:
      - type: bind
        source: ./data/minio
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  minio-init:
    image: autoforge/offline-minio-client:RELEASE.2025-04-16T18-13-26Z-amd64
    platform: linux/amd64
    pull_policy: never
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-autoforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?fill MINIO_ROOT_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mc --config-dir /tmp/.mc alias set autoforge http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc --config-dir /tmp/.mc mb --ignore-existing --region us-east-1 autoforge/autoforge-objects
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
